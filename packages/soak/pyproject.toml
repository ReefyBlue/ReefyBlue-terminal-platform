[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "terminal-soak"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["terminal-model", "terminal-tos-stub", "httpx"]

[tool.uv.sources]
terminal-model = { workspace = true }
terminal-tos-stub = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/terminal_soak"]
