[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "terminal-gateway"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["terminal-model", "terminal-opcua", "pyyaml>=6"]

[tool.uv.sources]
terminal-model = { workspace = true }
terminal-opcua = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/terminal_gateway"]
