[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "terminal-kpi"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["terminal-model", "terminal-ecs"]

[tool.uv.sources]
terminal-model = { workspace = true }
terminal-ecs = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/terminal_kpi"]
