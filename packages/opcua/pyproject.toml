[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "terminal-opcua"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["terminal-model", "asyncua>=2.1"]

[tool.uv.sources]
terminal-model = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/terminal_opcua"]
