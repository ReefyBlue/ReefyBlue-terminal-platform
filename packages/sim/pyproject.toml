[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "terminal-sim"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["salabim>=25", "pyyaml>=6", "terminal-model"]

[tool.uv.sources]
terminal-model = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/terminal_sim"]
