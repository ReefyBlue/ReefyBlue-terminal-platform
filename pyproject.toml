[project]
name = "terminal-platform"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest"]

[tool.uv.workspace]
members = ["packages/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
    "packages/model/src",
    "packages/sim/src",
    "packages/ecs/src",
    "packages/tos_stub/src",
]
