[project]
name = "terminal-platform"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest",
    "terminal-model",
    "terminal-sim",
    "terminal-ecs",
    "terminal-tos-stub",
    "terminal-runner",
    "terminal-opcua",
    "terminal-gateway",
    "pytest-asyncio>=1.4.1.post1",
]

[tool.uv.sources]
terminal-model = { workspace = true }
terminal-sim = { workspace = true }
terminal-ecs = { workspace = true }
terminal-tos-stub = { workspace = true }
terminal-runner = { workspace = true }
terminal-opcua = { workspace = true }
terminal-gateway = { workspace = true }

[tool.uv.workspace]
members = ["packages/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "e2e: full 200-container scenario runs (a few seconds each)",
    "e2e_opcua: sim + gateway subprocesses + runner over OPC UA (minutes; run with -m e2e_opcua)",
]
addopts = "-m 'not e2e_opcua'"
pythonpath = [
    "packages/model/src",
    "packages/sim/src",
    "packages/ecs/src",
    "packages/tos_stub/src",
    "packages/runner/src",
    "packages/opcua/src",
    "packages/gateway/src",
]
